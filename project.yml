name: MUBAR
options:
  bundleIdPrefix: com.mubar
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MUBAR:
    type: application
    platform: macOS
    sources:
      - path: MUBAR
    info:
      path: MUBAR/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MUBAR
        NSBluetoothAlwaysUsageDescription: MUBAR reads connected Bluetooth devices to show their status and battery.
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mubar.MUBAR
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
